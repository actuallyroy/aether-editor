[package]
name = "aether-renderer"
version = "0.7.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
encoding_rs = "0.8"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
fancy-regex = "0.18.0"
glyphon = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
pollster = "0.4"
unicode-width = "0.2"
portable-pty = "0.8"
resvg = "0.45"
self_update = { version = "0.42", default-features = false, features = ["rustls"] }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.15"
vte = "0.13"
ropey = "1.6"
rquickjs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
# VS Code-style TextMate highlighting (pure-Rust fancy-regex backend — no C deps,
# keeps the cross-platform release matrix safe). Bundles common-language syntaxes.
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes"] }
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
tree-sitter-json = "0.23"
tree-sitter-rust = "0.23"
ureq = { version = "2", features = ["tls"] }
# Blocking WebSocket server for the Claude Code IDE-integration MCP channel
# (localhost ws://, no TLS) — sync, fits the std-threads model (no async runtime).
# The `rustls-tls-webpki-roots` feature also lets the SAME crate dial OUT over
# wss:// (OpenAI's Realtime voice API) with a self-contained cert store — no
# extra TLS dependency needed for that outbound connection.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Mic capture + speaker playback for live voice chat (OpenAI Realtime API).
cpal = "0.15"
base64 = "0.22"
wgpu = "22"
winit = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23"
notify = "6"

# Native macOS menu bar (system menu, top of the screen). Other platforms draw the
# custom in-window menu instead.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.16"
# aether:// URL scheme (OAuth deep links): Apple Event handler for kAEGetURL.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject"] }
# Extension webviews: an in-process WKWebView attached as a child NSView of the
# editor window (no separate host process / virtual display needed on macOS).
wry = "0.47"

# Extension webviews on Windows: in-process WebView2 child of the editor window
# (WebView2 runtime ships with Windows 11 / evergreen installer on 10).
[target.'cfg(target_os = "windows")'.dependencies]
wry = "0.47"

# Webview host (`aether --webview-host`): a separate GTK process that renders
# extension webviews (Claude Code panel etc.) with webkit2gtk via wry. Separate
# process because GTK's main loop can't share a thread with winit's.
[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.47"
gtk = "0.18"
glib = "0.18"
x11rb = { version = "0.13", features = ["composite", "shape", "xtest"] }
# Snapshot API for the offscreen webview (webkit renders frames itself — the only
# reliable headless frame source). Version matches wry's own webkit2gtk dep.
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Real acoustic echo cancellation (Google's AEC3, the same one Chrome/WebRTC use for
# `echoCancellation: true`) — lets the voice call mic stay live and pick up a genuine
# interruption while the assistant is talking, instead of just muting. `bundled` builds
# the (small) C++ core from source; needs meson/ninja/pkg-config. macOS/Linux only for
# now — the bundled abseil-cpp dependency doesn't build on the Windows runner's MinGW
# toolchain (WinRT header conflicts in abseil's cctz); Windows voice calls fall back to
# unprocessed mic audio (no barge-in echo cancellation) until that's sorted out.
[target.'cfg(not(target_os = "windows"))'.dependencies]
webrtc-audio-processing = { version = "2", features = ["bundled"] }
