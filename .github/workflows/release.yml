name: Release

# Build release binaries for Windows + Linux. Runs on a version tag (vX.Y.Z) and
# can be triggered manually. Tag pushes also publish a GitHub Release with the
# binaries attached. The codicon font is embedded (include_bytes!), so each build
# is a single self-contained executable — no assets to ship alongside it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets the release job dispatch the Pages/APT-repo rebuild

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: aether.exe
            asset: aether-windows-x86_64.exe
          # Pinned to the OLDEST supported runner: the binary links against the
          # build machine's glibc, and glibc is only forward-compatible. 22.04
          # (glibc 2.35) covers Ubuntu 22.04+/Debian 12+ instead of demanding
          # 2.39 from 24.04 (#35).
          - os: ubuntu-22.04
            bin: aether
            asset: aether-linux-x86_64
          - os: macos-latest
            bin: aether
            asset: aether-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No build cache here: the cache-save post-step is flaky on Windows and a
      # failure there marks the job failed, which skips the release-publish job.
      # Releases are infrequent, so a clean build is worth the reliability.

      # Linux build deps: rfd (GTK file dialogs), winit/glyphon (xkbcommon,
      # wayland, fontconfig), and a C/C++ toolchain for the bundled C deps
      # (tree-sitter grammars, QuickJS via rquickjs).
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 8 # fail fast instead of hanging silently if this stalls again
        env:
          # Harmless belt-and-suspenders in case needrestart's interactive "restart
          # services?" prompt ever fires; NOT what actually caused the hang below (see
          # Acquire:: flags) — confirmed by log: apt-get update itself stalled on the
          # runner's flaky azure.archive.ubuntu.com mirror with no built-in timeout.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo -E apt-get update $APT_OPTS
          sudo -E apt-get install -y --no-install-recommends $APT_OPTS \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libfontconfig1-dev \
            clang libclang-dev \
            meson ninja-build \
            libasound2-dev

      # meson/ninja/pkg-config build the bundled WebRTC AEC3 library
      # (`webrtc-audio-processing`, live voice chat's echo cancellation) from
      # source on every platform — no prebuilt/system package to link against.
      - name: Install macOS AEC build tools
        if: matrix.os == 'macos-latest'
        run: brew install meson ninja pkg-config

      - name: Install Windows AEC build tools
        if: matrix.os == 'windows-latest'
        run: |
          pip install meson ninja
          choco install pkgconfiglite -y --no-progress

      # Bake the Azure OpenAI key + endpoint into the binary so AI commit messages
      # work out of the box (option_env! reads these at compile time). Set these as
      # repo Actions secrets. NOTE: a key compiled into a distributed binary is
      # extractable — scope/rate-limit it and rotate if abused.
      - name: Build release
        env:
          AETHER_AZURE_API_KEY: ${{ secrets.AETHER_AZURE_API_KEY }}
          AETHER_AZURE_ENDPOINT: ${{ secrets.AETHER_AZURE_ENDPOINT }}
          AETHER_AZURE_DEPLOYMENT: ${{ secrets.AETHER_AZURE_DEPLOYMENT }}
        run: cargo build --release -p aether-renderer

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      # Linux extras: a Debian package (apt/dpkg) and a portable AppImage, both
      # built from the binary above. The .deb also feeds the hosted APT repo
      # (see .github/workflows/pages.yml).
      - name: Fetch ripgrep (bundled for extensions)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -e
          RGV=14.1.1
          curl -sL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RGV}/ripgrep-${RGV}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p ripgrep && tar -xzf rg.tar.gz --strip-components=1 -C ripgrep "ripgrep-${RGV}-x86_64-unknown-linux-musl/rg"
          chmod +x ripgrep/rg

      - name: Build Linux .deb + AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Untagged manual runs have no version; fall back to the crate version.
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(grep -m1 '^version' renderer/Cargo.toml | cut -d'"' -f2)"
          fi
          chmod +x packaging/build-deb.sh packaging/build-appimage.sh
          packaging/build-deb.sh "target/release/aether" "$VERSION" dist
          packaging/build-appimage.sh "target/release/aether" "$VERSION" dist
          ls -la dist

      # Windows installer wizard (Inno Setup): Start Menu/desktop shortcuts,
      # optional PATH entry, and a real Add/Remove Programs uninstaller. The
      # bare aether.exe staged above is kept too (the in-app updater downloads
      # it to self-replace, and it doubles as a portable exe).
      - name: Fetch ripgrep (bundled for extensions)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rgv = "14.1.1"
          iwr "https://github.com/BurntSushi/ripgrep/releases/download/$rgv/ripgrep-$rgv-x86_64-pc-windows-msvc.zip" -OutFile rg.zip
          Expand-Archive rg.zip -DestinationPath rgtmp
          New-Item -ItemType Directory -Force ripgrep | Out-Null
          Copy-Item "rgtmp/ripgrep-$rgv-x86_64-pc-windows-msvc/rg.exe" ripgrep/rg.exe

      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          # Untagged manual runs have no version; fall back to the crate version.
          if (-not $version -or $version -eq "$env:GITHUB_REF_NAME") {
            $version = (Select-String -Path renderer/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $exe = (Resolve-Path target/release/aether.exe).Path
          & $iscc "/DMyAppVersion=$version" "/DSourceExe=$exe" packaging/windows/aether.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Copy-Item packaging/windows/installer/aether-windows-setup-x86_64.exe dist/
          Get-ChildItem dist

      # Package an installable Aether.app inside a .dmg (with an Applications drop
      # target). The bare binary above is kept too — the in-app auto-updater
      # downloads `aether-macos-arm64` to self-replace. The .app is unsigned, so
      # first launch needs right-click → Open (or `xattr -cr /Applications/Aether.app`).
      - name: Fetch ripgrep (bundled for extensions)
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          RGV=14.1.1
          curl -sL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RGV}/ripgrep-${RGV}-aarch64-apple-darwin.tar.gz"
          mkdir -p ripgrep && tar -xzf rg.tar.gz --strip-components=1 -C ripgrep "ripgrep-${RGV}-aarch64-apple-darwin/rg"
          chmod +x ripgrep/rg

      - name: Bundle macOS .app + DMG
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          APP="Aether.app"
          rm -rf "$APP" dmgroot
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/aether "$APP/Contents/MacOS/aether"
          chmod +x "$APP/Contents/MacOS/aether"
          # Node extension host — host_script() looks next to the executable.
          cp -R ext-host "$APP/Contents/MacOS/ext-host"
          # Bundled ripgrep — extensions resolve VSCode's rg via the ext host.
          if [ -f ripgrep/rg ]; then mkdir -p "$APP/Contents/MacOS/ripgrep"; cp ripgrep/rg "$APP/Contents/MacOS/ripgrep/rg"; fi
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key><string>Aether</string>
          <key>CFBundleDisplayName</key><string>Aether</string>
          <key>CFBundleExecutable</key><string>aether</string>
          <key>CFBundleIdentifier</key><string>com.actuallyroy.aether</string>
          <key>CFBundleVersion</key><string>${VERSION}</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>icon</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>CFBundleURLTypes</key>
          <array>
            <dict>
              <key>CFBundleURLName</key><string>Aether deep link</string>
              <key>CFBundleURLSchemes</key><array><string>aether</string></array>
            </dict>
          </array>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # App icon from the bundled SVG logo (best-effort — default icon if it fails).
          if brew install librsvg >/dev/null 2>&1; then
            mkdir -p icon.iconset
            for s in 16 32 128 256 512; do
              rsvg-convert -w "$s" -h "$s" renderer/assets/logo.svg -o "icon.iconset/icon_${s}x${s}.png" || true
              rsvg-convert -w "$((s*2))" -h "$((s*2))" renderer/assets/logo.svg -o "icon.iconset/icon_${s}x${s}@2x.png" || true
            done
            iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns" || true
          fi
          # DMG with an Applications symlink for drag-to-install.
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Aether" -srcfolder dmgroot -ov -format UDZO "dist/Aether-macos-arm64.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # The `release: published` event above is fired with GITHUB_TOKEN, which
      # by design does NOT trigger other workflows — so the Pages/APT-repo
      # rebuild won't start on its own. workflow_dispatch IS exempt from that
      # rule, so dispatch it explicitly to ingest this release's .deb.
      - name: Rebuild APT repository (Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        # This job doesn't check out the repo, so gh has no local git context —
        # name the repo explicitly.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
